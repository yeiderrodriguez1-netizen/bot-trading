name: Paper trading diario

on:
  schedule:
    - cron: '35 21 * * 1-5'
    - cron: '0 12 * * 6,0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper_trading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar paper trading
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_paper_trading.py

      - name: Guardar portafolio en el repo
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add portfolio.json
          git diff --cached --quiet || git commit -m "Actualiza portafolio ficticio [skip ci]"
          git push
