name: Paper trading intradia (cada 15 min)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  intradia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot intradia
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_intradia.py

      - name: Guardar portafolio intradia en el repo
        run: |
          git config user.name "intradia-bot"
          git config user.email "bot@users.noreply.github.com"
          git add portfolio_intradia.json
          git diff --cached --quiet || git commit -m "Actualiza portafolio intradia [skip ci]"
          git push
